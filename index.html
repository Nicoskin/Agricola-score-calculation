<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Счётный лист Агриколы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Подсчёт победных очков в Агриколе (издание 2016 года) с подсказками">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&family=Roboto+Slab:wght@700;800&display=swap">
<style>
:root{
  --ground:#E8ECDC; --surface:#F9FAF3; --surface-2:#EFF2E4; --ink:#23251A; --muted:#606450;
  --line:#CBD0B6; --accent:#46701F; --accent-ink:#FFFFFF; --accent-soft:#D9E5C1;
  --neg:#8A5424; --focus:#2F5F9E; --shadow:rgba(35,37,26,.10);
  --display:"Alegreya SC", Georgia, "Times New Roman", serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16180F; --surface:#20231A; --surface-2:#292D21; --ink:#E9EAD8; --muted:#A2A688;
    --line:#3A3F2F; --accent:#94BD57; --accent-ink:#14170D; --accent-soft:#33412A;
    --neg:#D9A06A; --focus:#8DB4F0; --shadow:rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#16180F; --surface:#20231A; --surface-2:#292D21; --ink:#E9EAD8; --muted:#A2A688;
  --line:#3A3F2F; --accent:#94BD57; --accent-ink:#14170D; --accent-soft:#33412A;
  --neg:#D9A06A; --focus:#8DB4F0; --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%;
  padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

/* ---------- монеты ---------- */
.coin{--s:46px;flex:none;width:var(--s);height:var(--s);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font:800 calc(var(--s) * .54)/1 "Roboto Slab", Rockwell, Georgia, serif;font-variant-numeric:lining-nums tabular-nums;color:#3A2905;
  background:radial-gradient(circle at 34% 28%,#FFF6B8 0,#F0CE4E 38%,#C99B22 78%,#A57A12 100%);
  border:2px solid #6F520C;box-shadow:inset 0 0 0 2px rgba(255,244,176,.75),inset 0 0 0 4px rgba(150,110,20,.35),0 1px 2px rgba(0,0,0,.35)}
.coin.neg{color:#F7E6C6;background:radial-gradient(circle at 34% 28%,#B98452 0,#8A5628 42%,#5E3614 85%,#4A2A0E 100%);
  border-color:#2E1A07;box-shadow:inset 0 0 0 2px rgba(235,190,140,.45),inset 0 0 0 4px rgba(40,20,5,.3),0 1px 2px rgba(0,0,0,.35)}
.coin .mi{font-style:normal;font-weight:700;font-size:.55em;margin-right:.05em;transform:translateY(-.02em)}
.forest,.stepper,.seg,.owner,.coin,.hint-btn,.tot,.secnav{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.coin.empty{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--muted);font-weight:500}
.coin.sm{--s:32px}
.coin.md{--s:36px}
.forest .coin.empty{border-color:rgba(255,255,255,.55);color:#EAF3DC}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--ground) 92%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-row{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(8px + env(safe-area-inset-top)) 14px 2px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font:800 25px/1 var(--display)}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.secnav{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 10px 8px;scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav a{flex:none;padding:6px 13px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
.secnav a[aria-current="true"]{background:var(--ink);color:var(--surface)}

.btn{font-weight:700;font-size:15px;padding:9px 14px;min-height:42px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:#B0412A;border-color:#B0412A}
.linkbtn{border:0;background:none;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}

/* ---------- раскладка ---------- */
.layout{max-width:1180px;margin:0 auto;padding:6px 10px 20px;display:grid;gap:20px}
@media (min-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr) 400px;align-items:start;padding-inline:16px}
  .results{position:sticky;top:104px;max-height:calc(100vh - 190px);overflow:auto}
}
.group{scroll-margin-top:100px}
.group > h2{margin:18px 4px 8px;font:700 23px/1.1 var(--display)}
.cats{display:grid;gap:10px;margin-top:10px}

/* ---------- табло как на игровом поле ---------- */
.forest{background-color:#3B7127;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 2px 6px var(--shadow);
  background-image:
    radial-gradient(circle at 30% 30%,rgba(150,205,95,.42) 0 9px,transparent 10px),
    radial-gradient(circle at 70% 70%,rgba(22,62,16,.42) 0 13px,transparent 14px),
    radial-gradient(circle at 62% 18%,rgba(105,168,62,.5) 0 7px,transparent 8px),
    radial-gradient(circle at 18% 82%,rgba(118,178,72,.38) 0 11px,transparent 12px),
    radial-gradient(circle at 50% 50%,rgba(30,78,22,.3) 0 16px,transparent 17px);
  background-size:38px 38px,54px 54px,29px 29px,46px 46px,71px 71px}
.rboard.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:9px}
.rcol{display:flex;flex-direction:column;align-items:center;gap:10px;padding:9px 3px 12px;border-radius:10px;background:rgba(222,248,196,.2)}
.tile{position:relative;width:100%;max-width:62px;aspect-ratio:1;display:grid;place-items:center}
.tile > svg{position:relative;width:100%;height:100%}
.tile b{position:absolute;left:-4px;right:-4px;top:50%;transform:translateY(-50%);text-align:center;font:800 clamp(18px,5.8vw,24px)/1 var(--body);
  color:#231708;text-shadow:0 0 3px #FFF6DC,0 0 3px #FFF6DC,0 0 2px #FFF6DC;pointer-events:none}
.tile.lbl-top b{top:36%}
.tile.plaque > svg{opacity:.78}
.tile.plaque b{top:56%;color:#1B1206;font-size:clamp(18px,5.4vw,23px);
  text-shadow:-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff,1.5px 1.5px 0 #fff,0 -2px 0 #fff,0 2px 0 #fff,-2px 0 0 #fff,2px 0 0 #fff,0 0 5px rgba(255,255,255,.9)}
.tile.hit::before{content:"";position:absolute;inset:-8px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,242,160,.9) 0,rgba(255,236,140,.5) 48%,rgba(255,236,140,0) 70%)}
.marks{position:absolute;left:-6px;right:-6px;bottom:-9px;display:flex;justify-content:center;pointer-events:none}
.marks svg{width:19px;height:19px;margin:0 -3px}
.rboard.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;padding:9px}
.pair{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:10px;background:rgba(222,248,196,.2)}
.pair-top{display:flex;align-items:center;justify-content:center;gap:12px}
.pair .tile{width:58px}
.pair small{min-height:2.4em;display:flex;align-items:center;justify-content:center;text-align:center;color:#F5FBEA;font-size:16px;font-weight:700;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.75)}

/* ---------- карточки категорий ---------- */
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.cat-h{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center}
.ico{width:46px;height:46px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center}
.ico svg{width:38px;height:38px}
.cat-h h3{margin:0;font:700 19px/1.15 var(--body);display:flex;align-items:center;gap:6px}
.donemark{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.rule{display:block;font-size:13.5px;color:var(--muted);line-height:1.25;margin-top:2px}
.hint-btn{min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.hint-btn[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.plist{list-style:none;margin:8px 0 0;padding:0}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto 46px;gap:10px;align-items:center;padding:8px 0}
.prow + .prow{border-top:1px solid var(--line)}
.pname{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;min-width:0}
.pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px rgba(0,0,0,.22)}
.pn{color:var(--pn-l)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pn{color:var(--pn-d)} }
:root[data-theme="dark"] .pn{color:var(--pn-d)}
.owners .owner[aria-pressed="true"] .pn{color:var(--pc-ink)}
.prow.rooms{grid-template-columns:minmax(0,1fr) 46px}
.rctrl{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.prow.sum .mcount{color:var(--muted);font-size:14px;white-space:nowrap}

.stepper{display:flex;align-items:stretch;border:1px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--surface);flex:none}
.stepper button{width:48px;height:48px;border:0;background:var(--surface-2);font:700 27px/1 var(--body);cursor:pointer}
.stepper button:active{background:var(--accent-soft)}
.stepper input{width:54px;text-align:center;border:0;border-inline:1px solid var(--line);background:var(--surface);font:800 21px var(--body);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;padding:0}
.stepper input::placeholder{color:var(--muted);font-weight:400}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper.sm button{width:40px;height:40px;font-size:22px}
.stepper.sm input{width:46px;font-size:18px}
@media (max-width:360px){ .stepper button{width:42px} .stepper input{width:46px} }

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:68px;height:48px;border:0;background:var(--surface);cursor:pointer;font-size:11.5px;line-height:1}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg svg{width:26px;height:26px}

/* подсказка */
.hint{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:12px 18px;align-items:start;background:var(--surface-2);border-radius:10px;padding:12px;margin-top:10px}
@media (max-width:640px){ .hint{grid-template-columns:1fr} }
.hint-art svg{display:block;width:100%;height:auto;max-width:320px}
.hint-text p{margin:0 0 8px;max-width:62ch}
.hint-text p:last-child{margin-bottom:0}
.hint-text .ex{font-weight:700}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:6px}
.eq-item{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.eq-ico{position:relative;width:56px;height:56px;border:1px solid var(--line);border-radius:9px;background:var(--surface);display:grid;place-items:center}
.eq-ico svg{width:44px;height:44px}
.eq-ico b{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.eq-item figcaption{font-size:12px;color:var(--muted);text-align:center;max-width:74px;line-height:1.15}
.op{font:700 20px var(--body);color:var(--muted);align-self:flex-start;margin-top:16px}
.eq-res{align-self:flex-start;margin-top:9px;font-weight:800;font-size:17px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);white-space:nowrap}

/* особые улучшения */
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:10px}
.mitem{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.mitem.owned{background:var(--accent-soft);border-color:var(--accent)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mname b{display:block;line-height:1.2}
.mname small{display:block;font-size:13px;color:var(--muted);line-height:1.2}
.owners{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.owner{display:inline-flex;align-items:center;gap:6px;min-height:38px;max-width:100%;padding:4px 12px 4px 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:700;cursor:pointer}
.owner[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:var(--pc-ink)}
.owner[aria-pressed="true"] .pdot{box-shadow:0 0 0 1.5px var(--pc-ink)}
.mbonus{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px}
.mbonus b{white-space:nowrap}
.cat .plist.summary{margin-top:10px;border-top:2px solid var(--line)}

/* ---------- итоги ---------- */
.results{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;scroll-margin-top:100px}
.results > h2{margin:0 0 10px;font:700 23px/1.1 var(--display)}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.ptot{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;column-gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.ptot > svg{grid-row:span 2;width:40px;height:40px}
.ptname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptot b{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums}
.ptot.lead{border-color:#B8901E;box-shadow:inset 0 0 0 1px #B8901E;background:color-mix(in srgb,#EFCB4A 20%,var(--surface-2))}
.ptot em{font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8A6A0E;margin-left:4px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ptot em{color:#E6C55A} }
:root[data-theme="dark"] .ptot em{color:#E6C55A}
.rgroup{margin-top:16px}
.rgroup h3{margin:0 2px 6px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rscroll{overflow-x:auto;border-radius:14px}
.rtable{display:grid;gap:4px;padding:8px;min-width:calc(160px + var(--n) * 44px)}
.rrow{display:grid;grid-template-columns:32px minmax(0,1fr) repeat(var(--n),36px);gap:8px;align-items:center;padding:4px 8px;border-radius:9px;background:rgba(222,248,196,.2)}
.rrow.rhead{background:none;padding-block:0}
.rhp{display:grid;place-items:center}
.rhp svg{width:24px;height:24px}
.ricon svg{width:32px;height:32px;display:block}
.rname{color:#F5FBEA;font-weight:700;font-size:15px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* нижняя панель */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:0 -6px 20px var(--shadow);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.dock-in{max-width:1180px;margin:0 auto;display:flex;gap:8px;overflow-x:auto}
.tot{flex:1 0 auto;min-width:120px;display:flex;align-items:center;gap:8px;min-height:50px;padding:4px 12px;border-radius:10px;background:var(--surface-2);color:var(--ink);text-decoration:none}
.tot span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.tot b{margin-left:auto;font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.tot.lead{box-shadow:inset 0 0 0 1.5px #B8901E;background:color-mix(in srgb,#EFCB4A 20%,var(--surface-2))}

/* диалог игроков */
dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100% - 20px));max-height:calc(100% - 40px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,22,12,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font:700 22px var(--display)}
.dlg-b{padding:4px 16px 12px;overflow:auto;max-height:65vh}
.pedit{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.pedit input{width:100%;min-width:0;font:700 18px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.swatches{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;padding:0;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw[aria-checked="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.swatches .linkbtn{margin-left:auto}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line)}

.export{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.export h3{margin:0 2px 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.export-btns{display:flex;flex-wrap:wrap;gap:8px}
.export-btns .btn{flex:1 1 auto}
.btn:disabled{opacity:.6;cursor:progress}
#exportImg{display:block;width:100%;height:auto;border-radius:10px}
.opt{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-weight:500;cursor:pointer;line-height:1.3}
.opt input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--accent)}
.dlg-b.pad{padding:12px 16px}

footer{max-width:1180px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:14px}
footer p{margin:0;max-width:75ch}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand"><h1>Агрикола</h1><small>издание 2016</small></div>
    <button type="button" class="btn ghost" id="openPlayers">Игроки</button>
  </div>
  <nav class="secnav" id="secnav" aria-label="Разделы подсчёта"></nav>
</header>

<main class="layout">
  <div id="cats"></div>
  <section class="results" id="results" aria-labelledby="resTitle">
    <h2 id="resTitle">Итоги партии</h2>
    <div class="podium" id="podium"></div>
    <div id="rgroups"></div>
    <div class="export">
      <h3>Выгрузить результаты</h3>
      <div class="export-btns">
        <button type="button" class="btn" id="expImg">Картинка</button>
        <button type="button" class="btn ghost" id="expTxt">Текст .txt</button>
        <button type="button" class="btn ghost" id="expJson">JSON</button>
      </div>
    </div>
  </section>
</main>

<footer>
  <p>Правила подсчёта — по изданию «Агриколы» 2016 года. Рисунки нарисованы для этой страницы по мотивам игровых компонентов. Всё сохраняется только в этом браузере.</p>
</footer>

<nav class="dock" aria-label="Текущий счёт"><div class="dock-in" id="dock"></div></nav>

/* мини-схема фермы 5×3 */
function farm(tokens, opts = {}) {
  const S = 36, P = 8, W = S * 5 + P * 2, H = S * 3 + P * 2, hl = opts.hl;
  const MF = {w:['#C08A52','#5A3818'], c:['#C9683F','#6A2C14'], s:['#A7ABAA','#474B4B']};
  let cells = '', fence = '', labels = '';
  const seen = {}, cnt = {n:0};
  const line = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  const badge = (cx, cy, L) => { const w = Math.max(16, L.length * 7 + 6); return `<g><rect x="${cx - w/2}" y="${cy - 8}" width="${w}" height="16" rx="8" fill="#FFFDF3" stroke="#2A2A1C" stroke-width="1"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-size="11.5" font-weight="800" fill="#2A2A1C">${L}</text></g>`; };
  tokens.forEach((t, i) => {
    const r = Math.floor(i / 5), c = i % 5, x = P + c * S, y = P + r * S, k = t[0], st = t.includes('t');
    const tag = k === 'p' ? (st ? 'pt' : 'p') : k;
    const on = !hl || hl.includes(tag);
    const tile = (f, s, dash) => `<rect x="${x + 2}" y="${y + 2}" width="${S - 4}" height="${S - 4}" rx="3" fill="${f}"${s ? ` stroke="${s}" stroke-width="1.3"` : ''}${dash ? ' stroke-dasharray="3 2"' : ''}/>`;
    let g = '';
    if (k === '.' || k === 't') g += tile('#A9C878', '#E7F1CF', true);
    else if (k === 'f' || k === 'g') {
      g += tile('#8A5A2E', '#4A2F17');
      for (let j = 1; j <= 3; j++) { const yy = y + 2 + j * (S - 4) / 4; g += `<line x1="${x + 8}" x2="${x + S - 8}" y1="${yy}" y2="${yy}" stroke="#B9844D" stroke-width="2" stroke-linecap="round"/>`; }
      if (k === 'g') g += `<g fill="#EBBE3E" stroke="#6E520F" stroke-width="1"><circle cx="${x + 13}" cy="${y + 19}" r="3.6"/><circle cx="${x + 20}" cy="${y + 15}" r="3.6"/><circle cx="${x + 22}" cy="${y + 22}" r="3.6"/></g>`;
    }
    else if (k === 'p') g += tile('#A9D364');
    else if (MF[k]) { const [f, l] = MF[k]; g += tile(f, l) + `<path d="M${x + 9} ${y + 19}l9 -8 9 8v10h-18z" fill="none" stroke="${l}" stroke-width="1.6" stroke-linejoin="round"/>`; }
    if (st) g += `<path d="M${x + 10} ${y + 21}l8-7 8 7v9h-16z" fill="#A36D39" stroke="#4A2F17" stroke-width="1.5" stroke-linejoin="round"/>`;
    cells += `<g opacity="${on ? 1 : .3}">${g}</g>`;
    if (k === 'p') {
      const G = t[1], same = j => j != null && tokens[j] && tokens[j][0] === 'p' && tokens[j][1] === G;
      if (!same(r > 0 ? i - 5 : null)) fence += line(x, y, x + S, y);
      if (!same(r < 2 ? i + 5 : null)) fence += line(x, y + S, x + S, y + S);
      if (!same(c > 0 ? i - 1 : null)) fence += line(x, y, x, y + S);
      if (!same(c < 4 ? i + 1 : null)) fence += line(x + S, y, x + S, y + S);
    }
    if (on && opts.label) { const L = opts.label(tag, t, seen, cnt); if (L) labels += badge(x + S - 10, y + 10, L); }
  });
  const fo = hl && !hl.some(h => h === 'p' || h === 'pt') ? .3 : 1;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || 'Схема фермы')}"><rect width="${W}" height="${H}" rx="8" fill="#5F8233"/>${cells}<g opacity="${fo}" stroke="#6B4118" stroke-width="3.5" stroke-linecap="round">${fence}</g>${labels}</svg>`;
}
const FARM = ['f','f','p1','p1','p2t', 'w','g','p1','p1','.', 'w','.','t','.','.'];

function eq(parts, result) {
  return '<div class="eq">' + parts.map((p, i) =>
    (i && p.op !== '' ? `<span class="op">${p.op || '+'}</span>` : '') +
    `<figure class="eq-item"><div class="eq-ico">${p.icon}${p.n != null ? `<b>${p.n}</b>` : ''}</div><figcaption>${p.cap || ''}</figcaption></figure>`
  ).join('') + (result ? `<span class="op">=</span><div class="eq-res">${result}</div>` : '') + '</div>';
}

const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const GROUPS = [
  {id:'land', title:'Поля и пастбища', nav:'Поля', cats:['fields','pastures']},

      {icon:() => IC.room('w'), pts:0, cap:'комната избы'}, {icon:() => IC.room('c'), pts:1, cap:'комната мазанки'},

/* ---------- состояние ---------- */
const uid = () => 'p' + Math.random().toString(36).slice(2, 9);
const blank = () => ({fields:null, pastures:null, grain:null, veg:null, sheep:null, boar:null, cattle:null,
  unused:null, stables:null, roomType:'w', rooms:null, family:null, cards:null, bonus:null, begging:null});
const mkPlayer = (name, color) => ({id:uid(), name, color, v:blank()});
const freshState = () => ({players:[mkPlayer('Игрок 1', 'purple'), mkPlayer('Игрок 2', 'red')], majors:{}, res:{}});

/* Имена и цвета игроков дублируются в куки на 400 дней (больше браузеры не разрешают),
   очки текущей партии хранятся в localStorage. */
const COOKIE = 'agricola_players';
const COOKIE_DAYS = 400;
function readPlayersCookie() {
  try {
    const m = document.cookie.match(new RegExp('(?:^|; )' + COOKIE + '=([^;]*)'));
    if (!m) return null;
    const list = JSON.parse(decodeURIComponent(m[1]));
    if (!Array.isArray(list)) return null;
    const ok = list.filter(x => x && typeof x.n === 'string').slice(0, 6);
    return ok.length ? ok : null;
  } catch (e) { return null; }
}
function writePlayersCookie() {
  try {
    const data = encodeURIComponent(JSON.stringify(state.players.map(p => ({n:p.name, c:p.color}))));
    const path = location.pathname.replace(/[^/]*$/, '') || '/';
    document.cookie = `${COOKIE}=${data}; max-age=${COOKIE_DAYS * 86400}; path=${path}; SameSite=Lax${location.protocol === 'https:' ? '; Secure' : ''}`;
  } catch (e) {}
}

let state;
try {
  const raw = JSON.parse(localStorage.getItem(STORE));
  if (raw && Array.isArray(raw.players) && raw.players.length) {
    raw.players.forEach(p => { p.id = p.id || uid(); p.v = Object.assign(blank(), p.v); if (!COLORS[p.color]) p.color = 'red'; });
    raw.majors = raw.majors || {}; raw.res = raw.res || {};
    state = raw;
  }
} catch (e) {}
if (!state) {
  const saved = readPlayersCookie();
  state = saved
    ? {players:saved.map(x => mkPlayer(x.n, COLORS[x.c] ? x.c : 'purple')), majors:{}, res:{}}
    : freshState();
}

const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} writePlayersCookie(); };
writePlayersCookie(); /* продлеваем срок куки при каждом заходе */
const byId = id => state.players.find(p => p.id === id);

function points(p, c) {
  const v = p.v;
  switch (c.kind) {
    case 'ladder': { const n = v[c.id]; if (n == null) return null; const cell = c.ladder.find(([a, b]) => n >= a && n <= b); return cell ? cell[2] : 0; }
    case 'unit': return v[c.id] == null ? null : v[c.id] * c.per;
    case 'rooms': return v.rooms == null ? null : v.rooms * MAT[v.roomType].per;
    case 'majors': return MAJORS.filter(m => state.majors[m.id] === p.id).reduce((s, m) => s + m.pts + (m.steps ? craftBonus(state.res[m.id], m.steps) : 0), 0);
    case 'free': return v[c.id];
  }
  return null;
}
const total = p => CATS.reduce((s, c) => s + (points(p, c) || 0), 0);

/* ---------- отрисовка ---------- */
const catsEl = $('#cats'), dock = $('#dock'), secnav = $('#secnav'), podium = $('#podium'), rgroups = $('#rgroups');
const openHints = new Set();

const stepper = (key, pid, val, min, max, label, sm) =>
  `<div class="stepper${sm ? ' sm' : ''}"><button type="button" data-step="-1" aria-label="${esc(label)}: меньше">−</button><input type="number" inputmode="numeric" pattern="-?[0-9]*" placeholder="—" data-key="${key}" data-pid="${pid}" value="${val ?? ''}" min="${min}" max="${max}" aria-label="${esc(label)}"><button type="button" data-step="1" aria-label="${esc(label)}: больше">+</button></div>`;

function boardHTML(g) {
  const lc = g.cats.map(id => CAT[id]).filter(c => c.kind === 'ladder');
  if (lc.length) {
    return `<div class="forest rboard scale" role="group" aria-label="Шкала очков: ${g.title}">${[0,1,2,3,4].map(i =>
      `<div class="rcol">${coin(lc[0].ladder[i][2], ' md')}${lc.map(c => { const [a, b, pt] = c.ladder[i];
        return `<div class="tile${c.id === 'pastures' ? ' lbl-top' : ''}${['sheep','boar','cattle'].includes(c.id) ? ' plaque' : ''}" data-tile="${c.id}-${i}" role="img" aria-label="${c.name} ${rng(a, b)}: ${fmt(pt)}">${c.icon()}<b>${rng(a, b)}</b><span class="marks"></span></div>`; }).join('')}</div>`).join('')}</div>`;
  }
  return `<div class="forest rboard pairs" role="group" aria-label="Очки: ${g.title}">${g.pairs.map(p =>
    `<div class="pair"><div class="pair-top"><div class="tile">${p.icon()}</div>${coin(p.pts, ' md')}</div><small>${p.cap}</small></div>`).join('')}</div>`;
}

function catHTML(c) {
  const open = openHints.has(c.id), h = c.hint(), ps = state.players;
  const head = `<header class="cat-h">
      <div class="ico">${c.icon()}</div>
      <div><h3>${c.name}<span class="donemark" data-done="${c.id}" hidden title="Посчитано у всех">${CHECK}</span></h3>${c.rule ? `<span class="rule">${c.rule}</span>` : ''}</div>
      <button type="button" class="hint-btn" aria-expanded="${open}" aria-controls="hint-${c.id}">${open ? 'Скрыть' : 'Как считать'}</button>
    </header>`;
  const hint = `<div class="hint" id="hint-${c.id}"${open ? '' : ' hidden'}><div class="hint-art">${h.art || ''}</div><div class="hint-text">${h.text.map(t => `<p>${t}</p>`).join('')}${h.ex ? `<p class="ex">${h.ex}</p>` : ''}</div></div>`;
  const name = p => `<span class="pname">${dot(p)}${pn(p)}</span>`;
  const pts = p => `<output class="coin" data-pts="${c.id}" data-pid="${p.id}"></output>`;
  let body;
  if (c.kind === 'majors') {
    body = `<div class="mlist" data-mlist></div><ul class="plist summary">${ps.map(p => `<li class="prow sum">${name(p)}<span class="mcount" data-mcount="${p.id}"></span>${pts(p)}</li>`).join('')}</ul>`;
  } else if (c.kind === 'rooms') {
    body = `<ul class="plist">${ps.map(p => `<li class="prow rooms">${name(p)}${pts(p)}<div class="rctrl"><div class="seg" role="group" aria-label="Дом: ${esc(p.name)}">${Object.entries(MAT).map(([k, m]) => `<button type="button" data-room="${k}" data-pid="${p.id}" aria-pressed="${p.v.roomType === k}" aria-label="${m.name}">${IC.room(k)}${m.short}</button>`).join('')}</div>${stepper('rooms', p.id, p.v.rooms, 0, c.max, 'Комнаты: ' + p.name)}</div></li>`).join('')}</ul>`;
  } else {
    body = `<ul class="plist">${ps.map(p => `<li class="prow">${name(p)}${stepper(c.id, p.id, p.v[c.id], c.min ?? 0, c.max, c.name + ': ' + p.name)}${pts(p)}</li>`).join('')}</ul>`;
  }
  return `<article class="cat" id="cat-${c.id}">${head}${hint}${body}</article>`;
}

function renderMajors() {
  const box = catsEl.querySelector('[data-mlist]'); if (!box) return;
  box.innerHTML = MAJORS.map(m => {
    const owner = byId(state.majors[m.id]);
    return `<div class="mitem${owner ? ' owned' : ''}">
      <div class="mtop"><span class="mname"><b>${m.name}</b>${m.sub ? `<small>${m.sub}</small>` : ''}</span>${coin(m.pts, ' sm')}</div>
      <div class="owners" role="group" aria-label="У кого: ${m.name}">${state.players.map(p => `<button type="button" class="owner" data-major="${m.id}" data-pid="${p.id}" aria-pressed="${owner === p}" style="--pc:${COLORS[p.color][0]};--pc-ink:${COLORS[p.color][2]}">${dot(p)}${pn(p)}</button>`).join('')}</div>
      ${owner && m.steps ? `<div class="mbonus"><span>${m.res} в запасе (${pn(owner)}) <b data-mbonus="${m.id}"></b></span>${stepper('res.' + m.id, '', state.res[m.id], 0, 60, m.res + ' в запасе', true)}</div>` : ''}
    </div>`;
  }).join('');
}

function renderAll() {
  catsEl.innerHTML = GROUPS.map(g => `<section class="group" id="g-${g.id}" aria-labelledby="gh-${g.id}"><h2 id="gh-${g.id}">${g.title}</h2>${boardHTML(g)}<div class="cats">${g.cats.map(id => catHTML(CAT[id])).join('')}</div></section>`).join('');
  secnav.innerHTML = GROUPS.map((g, i) => `<a href="#g-${g.id}" data-nav="g-${g.id}" aria-current="${i === 0}">${g.nav}</a>`).join('') + '<a href="#results" data-nav="results" aria-current="false">Итоги</a>';
  renderMajors();
  update();
  spy();
}

function update() {
  const ps = state.players;
  ps.forEach(p => CATS.forEach(c => {
    const el = catsEl.querySelector(`[data-pts="${c.id}"][data-pid="${p.id}"]`); if (!el) return;
    const n = points(p, c);
    el.innerHTML = n == null ? '—' : coinInner(n);
    el.classList.toggle('neg', n != null && n < 0);
    el.classList.toggle('empty', n == null);
  }));
  CATS.forEach(c => {
    if (c.kind === 'ladder') c.ladder.forEach(([a, b], i) => {
      const tile = catsEl.querySelector(`[data-tile="${c.id}-${i}"]`); if (!tile) return;
      const hits = ps.filter(p => p.v[c.id] != null && p.v[c.id] >= a && p.v[c.id] <= b);
      tile.querySelector('.marks').innerHTML = hits.map(p => IC.meeple(COLORS[p.color][0])).join('');
      tile.classList.toggle('hit', hits.length > 0);
    });
    const dm = catsEl.querySelector(`[data-done="${c.id}"]`);
    if (dm) dm.hidden = c.kind === 'majors' || !ps.every(p => (c.kind === 'rooms' ? p.v.rooms : p.v[c.id]) != null);
  });
  catsEl.querySelectorAll('[data-room]').forEach(b => b.setAttribute('aria-pressed', String(byId(b.dataset.pid).v.roomType === b.dataset.room)));
  MAJORS.forEach(m => { const el = catsEl.querySelector(`[data-mbonus="${m.id}"]`); if (el) el.textContent = '→ бонус ' + craftBonus(state.res[m.id], m.steps); });
  ps.forEach(p => {
    const el = catsEl.querySelector(`[data-mcount="${p.id}"]`); if (!el) return;
    const k = MAJORS.filter(m => state.majors[m.id] === p.id).length;
    el.textContent = k ? `${k} ${plural(k, ['карта', 'карты', 'карт'])}` : 'нет карт';
  });
  renderDock();
  renderResults();
}

function leaders() {
  const totals = state.players.map(total), max = Math.max(...totals);
  const show = state.players.length > 1 && totals.some(t => t !== max);
  return {totals, isLead: i => show && totals[i] === max};
}

function renderDock() {
  const {totals, isLead} = leaders();
  dock.innerHTML = state.players.map((p, i) => `<a class="tot${isLead(i) ? ' lead' : ''}" href="#results">${dot(p)}${pn(p)}<b>${fmtT(totals[i])}</b></a>`).join('');
}

function renderResults() {
  const ps = state.players, {totals, isLead} = leaders();
  podium.innerHTML = ps.map((p, i) => `<div class="ptot${isLead(i) ? ' lead' : ''}">${IC.meeple(COLORS[p.color][0])}<span class="ptname">${pn(p)}${isLead(i) ? '<em>лидер</em>' : ''}</span><b>${fmtT(totals[i])}</b></div>`).join('');
  rgroups.innerHTML = GROUPS.map(g => `<div class="rgroup"><h3>${g.title}</h3><div class="rscroll"><div class="forest rtable" style="--n:${ps.length}" role="table" aria-label="${g.title}">
      <div class="rrow rhead" role="row"><span role="columnheader"><span class="sr">Значок</span></span><span role="columnheader"><span class="sr">Категория</span></span>${ps.map(p => `<span class="rhp" role="columnheader" title="${esc(p.name)}">${IC.meeple(COLORS[p.color][0])}<span class="sr">${esc(p.name)}</span></span>`).join('')}</div>
      ${g.cats.map(id => { const c = CAT[id]; return `<div class="rrow" role="row"><span class="ricon" role="cell">${c.icon()}</span><span class="rname" role="rowheader">${c.short}</span>${ps.map(p => `<span role="cell">${coin(points(p, c), ' sm')}</span>`).join('')}</div>`; }).join('')}
    </div></div></div>`).join('');
}

let observer;
function spy() {
  if (!('IntersectionObserver' in window)) return;
  if (observer) observer.disconnect();
  const set = id => secnav.querySelectorAll('[data-nav]').forEach(a => a.setAttribute('aria-current', String(a.dataset.nav === id)));
  observer = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) set(e.target.id); }), {rootMargin:'-35% 0px -60% 0px'});
  document.querySelectorAll('.group, #results').forEach(s => observer.observe(s));
}

/* ---------- ввод ---------- */
const getVal = (k, pid) => k.startsWith('res.') ? state.res[k.slice(4)] : byId(pid).v[k];
const setVal = (k, pid, n) => { if (k.startsWith('res.')) state.res[k.slice(4)] = n; else byId(pid).v[k] = n; };
const clamp = (n, inp) => Math.min(+inp.max, Math.max(+inp.min, n));
const changed = () => { save(); update(); };

catsEl.addEventListener('click', e => {
  const step = e.target.closest('[data-step]');
  if (step) {
    const inp = step.parentElement.querySelector('input'), d = +step.dataset.step;
    const now = inp.value === '' ? null : parseInt(inp.value, 10);
    const n = clamp(now == null || isNaN(now) ? (d > 0 ? 1 : 0) : now + d, inp);
    inp.value = n; setVal(inp.dataset.key, inp.dataset.pid, n); changed(); return;
  }
  const hb = e.target.closest('.hint-btn');
  if (hb) {
    const id = hb.getAttribute('aria-controls'), h = document.getElementById(id), open = h.hidden;
    h.hidden = !open; hb.setAttribute('aria-expanded', String(open)); hb.textContent = open ? 'Скрыть' : 'Как считать';
    const cid = id.slice(5); if (open) openHints.add(cid); else openHints.delete(cid);
    return;
  }
  const rm = e.target.closest('[data-room]');
  if (rm) { byId(rm.dataset.pid).v.roomType = rm.dataset.room; changed(); return; }
  const ow = e.target.closest('[data-major]');
  if (ow) {
    const m = ow.dataset.major;
    if (state.majors[m] === ow.dataset.pid) delete state.majors[m]; else state.majors[m] = ow.dataset.pid;
    renderMajors(); changed();
  }
});
catsEl.addEventListener('input', e => {
  const inp = e.target.closest('[data-key]'); if (!inp) return;
  if (inp.value === '') { setVal(inp.dataset.key, inp.dataset.pid, null); changed(); return; }
  const n = parseInt(inp.value, 10); if (isNaN(n)) return;
  setVal(inp.dataset.key, inp.dataset.pid, clamp(n, inp)); changed();
});
catsEl.addEventListener('change', e => {
  const inp = e.target.closest('[data-key]'); if (inp) { const v = getVal(inp.dataset.key, inp.dataset.pid); inp.value = v ?? ''; }
});
catsEl.addEventListener('focusin', e => { if (e.target.matches('[data-key]')) e.target.select(); });

/* ---------- выгрузка результатов ---------- */
const pad2 = x => String(x).padStart(2, '0');
const stamp = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}`;
const dateRu = d => d.toLocaleString('ru-RU', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
const placeOf = (totals, i) => 1 + totals.filter(t => t > totals[i]).length;
const ptsWord = n => plural(n, ['очко', 'очка', 'очков']);

function download(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}

function catDetail(p, c) {
  const n = points(p, c);
  if (c.kind === 'majors') {
    const cards = MAJORS.filter(m => state.majors[m.id] === p.id);
    return {points:n, cards:cards.map(m => ({name:m.name + (m.sub && !m.steps ? ` (${m.sub})` : ''), points:m.pts, bonus:m.steps ? craftBonus(state.res[m.id], m.steps) : 0}))};
  }
  if (c.kind === 'rooms') return {count:p.v.rooms, house:MAT[p.v.roomType].name, points:n};
  if (c.kind === 'free') return {points:n};
  return {count:p.v[c.id], points:n};
}

function resultData(now) {
  const ps = state.players, totals = ps.map(total);
  return {
    game:'Агрикола (издание 2016)',
    exportedAt:now.toISOString(),
    exportedAtLocal:dateRu(now),
    players:ps.map((p, i) => ({
      name:p.name, color:COLORS[p.color][1], place:placeOf(totals, i), total:totals[i],
      scores:Object.fromEntries(CATS.map(c => [c.id, Object.assign({category:c.name}, catDetail(p, c))]))
    })).sort((a, b) => a.place - b.place)
  };
}

function resultText(now) {
  const ps = state.players, totals = ps.map(total);
  const order = ps.map((p, i) => i).sort((a, b) => totals[b] - totals[a]);
  const L = ['АГРИКОЛА — ИТОГИ ПАРТИИ', 'Дата: ' + dateRu(now), '', 'Места:'];
  order.forEach(i => L.push(`  ${placeOf(totals, i)}. ${ps[i].name} — ${fmtT(totals[i])} ${ptsWord(totals[i])}`));
  GROUPS.forEach(g => {
    L.push('', g.title.toUpperCase());
    g.cats.forEach(id => {
      const c = CAT[id];
      L.push(`  ${c.name}:`);
      ps.forEach(p => {
        const d = catDetail(p, c);
        let s;
        if (d.points == null) s = 'не посчитано';
        else if (c.kind === 'majors') s = (d.cards.length ? d.cards.map(k => k.name + (k.bonus ? ` (бонус +${k.bonus})` : '')).join(', ') : 'нет карт') + ` → ${fmt(d.points)}`;
        else if (c.kind === 'rooms') s = `${d.count} (${d.house.toLowerCase()}) → ${fmt(d.points)}`;
        else if (c.kind === 'free') s = fmt(d.points);
        else s = `${d.count} → ${fmt(d.points)}`;
        L.push(`    ${p.name}: ${s}`);
      });
    });
  });
  L.push('', 'ИТОГО');
  order.forEach(i => L.push(`  ${ps[i].name}: ${fmtT(totals[i])}`));
  return L.join('\r\n') + '\r\n';
}

const svgImage = s => new Promise(res => {
  const img = new Image();
  img.onload = () => res(img); img.onerror = () => res(null);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" '));
});
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fitText(ctx, text, max) {
  if (ctx.measureText(text).width <= max) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + '…').width > max) t = t.slice(0, -1);
  return t + '…';
}
function drawCoin(ctx, cx, cy, r, n) {
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (n == null) {
    ctx.setLineDash([5, 5]); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.arc(cx, cy, r - 2, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = '#EAF3DC'; ctx.font = `500 ${r * .8}px "Alegreya Sans", sans-serif`; ctx.fillText('—', cx, cy);
    ctx.restore(); return;
  }
  const neg = n < 0;
  const g = ctx.createRadialGradient(cx - r * .32, cy - r * .44, r * .08, cx, cy, r);
  (neg ? ['#B98452', '#8A5628', '#5E3614', '#4A2A0E'] : ['#FFF6B8', '#F0CE4E', '#C99B22', '#A57A12']).forEach((col, i) => g.addColorStop([0, .4, .8, 1][i], col));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = neg ? '#2E1A07' : '#6F520C'; ctx.stroke();
  ctx.lineWidth = 2; ctx.strokeStyle = neg ? 'rgba(235,190,140,.5)' : 'rgba(255,244,176,.8)';
  ctx.beginPath(); ctx.arc(cx, cy, r - 4.5, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = neg ? '#F7E6C6' : '#3A2905';
  const digits = String(Math.abs(n)), ty = cy + r * .06, big = `800 ${r * 1.02}px "Roboto Slab", Georgia, serif`;
  ctx.font = big;
  if (!neg) { ctx.fillText(digits, cx, ty); ctx.restore(); return; }
  const dw = ctx.measureText(digits).width;
  ctx.font = `700 ${r * .62}px "Roboto Slab", Georgia, serif`;
  const mw = ctx.measureText('−').width, gap = r * .04, start = cx - (mw + gap + dw) / 2;
  ctx.fillText('−', start + mw / 2, ty);
  ctx.font = big; ctx.fillText(digits, start + mw + gap + dw / 2, ty);
  ctx.restore();
}
function drawForest(ctx, W, H) {
  ctx.fillStyle = '#2C5A1F'; ctx.fillRect(0, 0, W, H);
  [[60, 14, 'rgba(120,180,75,.26)', .3, .3], [86, 21, 'rgba(14,44,10,.45)', .7, .7], [46, 11, 'rgba(90,150,55,.3)', .62, .18],
   [74, 18, 'rgba(100,160,62,.22)', .18, .82], [114, 26, 'rgba(16,48,12,.35)', .5, .5]].forEach(([s, r, col, ox, oy]) => {
    ctx.fillStyle = col; ctx.beginPath();
    for (let y = 0; y < H + s; y += s) for (let x = 0; x < W + s; x += s) {
      ctx.moveTo(x + ox * s + r, y + oy * s); ctx.arc(x + ox * s, y + oy * s, r, 0, Math.PI * 2);
    }
    ctx.fill();
  });
  ctx.fillStyle = 'rgba(8,18,5,.22)'; ctx.fillRect(0, 0, W, H);
}

/* сколько штук стоит за очками (для картинки с количеством) */
const countOf = (p, c) => c.kind === 'ladder' || c.kind === 'unit' ? p.v[c.id]
  : c.kind === 'rooms' ? p.v.rooms
  : c.kind === 'majors' ? MAJORS.filter(m => state.majors[m.id] === p.id).length
  : null;

async function buildImage(now, details) {
  try {
    await Promise.all(['800 60px "Alegreya SC"', '700 30px "Alegreya Sans"', '500 30px "Alegreya Sans"', '800 30px "Roboto Slab"', '700 30px "Roboto Slab"']
      .map(f => document.fonts.load(f, '0123456789−АаБбВв')));
  } catch (e) {}
  const ps = state.players, n = ps.length, totals = ps.map(total);
  const order = ps.map((p, i) => i).sort((a, b) => totals[b] - totals[a]);
  const max = Math.max(...totals), showWin = n > 1 && totals.some(t => t !== max);
  const [catImgs, meeples, roomImgs] = await Promise.all([
    Promise.all(CATS.map(c => svgImage(c.icon()))),
    Promise.all(ps.map(p => svgImage(IC.meeple(COLORS[p.color][0])))),
    Promise.all(Object.keys(MAT).map(k => svgImage(IC.room(k))))
  ]);
  const catImg = Object.fromEntries(CATS.map((c, i) => [c.id, catImgs[i]]));
  const roomImg = Object.fromEntries(Object.keys(MAT).map((k, i) => [k, roomImgs[i]]));

  const W = 1080, P = 48, inner = W - P * 2;
  const perRow = Math.min(n, 3), gap = 16, cardW = (inner - gap * (perRow - 1)) / perRow, cardH = 150, cardRows = Math.ceil(n / perRow);
  const colW = details ? Math.min(200, Math.floor((inner - 330) / n)) : Math.min(130, Math.floor((inner - 440) / n));
  const rowH = 66, labelH = 52, headH = 104, totalH = 96;
  const tableTop = P + 150 + cardRows * (cardH + gap) + 20;
  const H = tableTop + headH + GROUPS.reduce((s, g) => s + labelH + g.cats.length * rowH, 0) + 16 + totalH + 70;

  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  drawForest(ctx, W, H);

  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.fillStyle = '#FFF6DC'; ctx.font = '800 76px "Alegreya SC", Georgia, serif'; ctx.fillText('Агрикола', P, P + 66);
  ctx.font = '500 30px "Alegreya Sans", sans-serif'; ctx.fillStyle = '#E6F1D6'; ctx.fillText('Итоги партии · ' + dateRu(now), P, P + 112);
  ctx.shadowColor = 'transparent';

  order.forEach((i, k) => {
    const p = ps[i], x = P + (k % perRow) * (cardW + gap), y = P + 150 + Math.floor(k / perRow) * (cardH + gap);
    const win = showWin && totals[i] === max;
    rrect(ctx, x, y, cardW, cardH, 18);
    ctx.fillStyle = win ? 'rgba(80,60,8,.55)' : 'rgba(16,34,10,.55)'; ctx.fill();
    if (win) { ctx.lineWidth = 4; ctx.strokeStyle = '#EFCB4A'; ctx.stroke(); }
    if (meeples[i]) ctx.drawImage(meeples[i], x + 16, y + (cardH - 76) / 2, 76, 76);
    const tx = x + 106, tw = cardW - 106 - 18;
    ctx.textAlign = 'left';
    ctx.font = '700 20px "Alegreya Sans", sans-serif'; ctx.fillStyle = win ? '#F3D467' : 'rgba(235,245,222,.75)';
    ctx.fillText(`${placeOf(totals, i)} место${win ? ' · победа' : ''}`, tx, y + 36);
    ctx.font = '700 32px "Alegreya Sans", sans-serif'; ctx.fillStyle = COLORS[p.color][4];
    ctx.fillText(fitText(ctx, p.name || 'Без имени', tw), tx, y + 76);
    ctx.font = '800 52px "Alegreya SC", Georgia, serif'; ctx.fillStyle = '#FFF6DC';
    ctx.fillText(fmtT(totals[i]), tx, y + 130);
    const numW = ctx.measureText(fmtT(totals[i])).width;
    ctx.font = '500 24px "Alegreya Sans", sans-serif'; ctx.fillStyle = 'rgba(235,245,222,.8)';
    ctx.fillText(ptsWord(totals[i]), tx + numW + 8, y + 130);
  });

  const colX = i => W - P - 12 - (n - i) * colW + colW / 2;
  let y = tableTop;
  rrect(ctx, P, y, inner, headH - 16, 14); ctx.fillStyle = 'rgba(12,26,8,.72)'; ctx.fill();
  if (details) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '500 22px "Alegreya Sans", sans-serif'; ctx.fillStyle = 'rgba(235,245,222,.75)';
    ctx.fillText('×  — сколько штук', P + 20, y + (headH - 16) / 2);
    ctx.textBaseline = 'alphabetic';
  }
  ps.forEach((p, i) => {
    if (meeples[i]) ctx.drawImage(meeples[i], colX(i) - 22, y + 6, 44, 44);
    ctx.textAlign = 'center'; ctx.font = '700 24px "Alegreya Sans", sans-serif'; ctx.fillStyle = COLORS[p.color][4];
    ctx.fillText(fitText(ctx, p.name || '—', colW - 8), colX(i), y + 76);
  });
  y += headH;
  GROUPS.forEach(g => {
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.font = '700 20px "Alegreya Sans", sans-serif'; ctx.fillStyle = 'rgba(240,248,228,.8)';
    ctx.fillText(g.title.toUpperCase(), P + 8, y + 34);
    y += labelH;
    g.cats.forEach(id => {
      const c = CAT[id], h = rowH - 8, cy = y + h / 2;
      rrect(ctx, P, y, inner, h, 12); ctx.fillStyle = 'rgba(222,248,196,.16)'; ctx.fill();
      if (catImg[id]) ctx.drawImage(catImg[id], P + 12, cy - 22, 44, 44);
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '700 27px "Alegreya Sans", sans-serif'; ctx.fillStyle = '#F5FBEA';
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
      ctx.fillText(fitText(ctx, c.short, colX(0) - colW / 2 - (P + 70) - 8), P + 70, cy + 1);
      ctx.shadowColor = 'transparent';
      ps.forEach((p, i) => {
        const coinX = details ? colX(i) + colW / 2 - 34 : colX(i);
        drawCoin(ctx, coinX, cy, 23, points(p, c));
        const cnt = details ? countOf(p, c) : null;
        if (cnt == null) return;
        const txt = '×' + cnt, right = coinX - 32;
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.font = '700 26px "Alegreya Sans", sans-serif'; ctx.fillStyle = '#F5FBEA';
        ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
        ctx.fillText(txt, right, cy + 1);
        ctx.shadowColor = 'transparent';
        if (c.kind === 'rooms' && colW >= 150 && roomImg[p.v.roomType]) {
          ctx.drawImage(roomImg[p.v.roomType], right - ctx.measureText(txt).width - 36, cy - 16, 32, 32);
        }
      });
      y += rowH;
    });
  });
  y += 16;
  const th = totalH - 10, ty = y + th / 2;
  rrect(ctx, P, y, inner, th, 14); ctx.fillStyle = 'rgba(16,34,10,.6)'; ctx.fill();
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillStyle = '#FFF6DC'; ctx.font = '800 38px "Alegreya SC", Georgia, serif';
  ctx.fillText('Итого', P + 20, ty);
  ps.forEach((p, i) => {
    ctx.textAlign = 'center'; ctx.font = '800 44px "Alegreya SC", Georgia, serif';
    ctx.fillStyle = showWin && totals[i] === max ? '#F3D467' : '#FFF6DC';
    ctx.fillText(fmtT(totals[i]), colX(i), ty + 2);
  });

  ctx.textBaseline = 'alphabetic'; ctx.font = '500 20px "Alegreya Sans", sans-serif'; ctx.fillStyle = 'rgba(235,245,222,.7)';
  ctx.textAlign = 'left'; ctx.fillText('Агрикола · издание 2016', P, H - 30);
  if (/^https?:$/.test(location.protocol)) { ctx.textAlign = 'right'; ctx.fillText(location.host + location.pathname.replace(/index\.html$/, ''), W - P, H - 30); }

  return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('браузер не смог сохранить картинку')), 'image/png'));
}
